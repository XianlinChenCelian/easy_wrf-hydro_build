name: Feature request
description: Suggest a focused improvement to WRF-Hydro build automation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What build or verification problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment or upstream reference
      description: Include compiler/version details or an upstream documentation link when relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request concerns WRF-Hydro build, environment, or verification automation.
          required: true
