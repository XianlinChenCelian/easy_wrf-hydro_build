[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-wrf-hydro-build"
version = "0.1.0"
description = "Reproducible WRF-Hydro dependency and compile helper for existing Linux environments."
authors = [
    { name = "XianlinChen", email = "chenxl@sehemodel.club" }
]
keywords = ["wrf-hydro", "hydrology", "netcdf", "mpi", "scientific-computing"]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/XianlinChenCelian/easy_wrf-hydro_build"
Repository = "https://github.com/XianlinChenCelian/easy_wrf-hydro_build"
Issues = "https://github.com/XianlinChenCelian/easy_wrf-hydro_build/issues"
Documentation = "https://github.com/XianlinChenCelian/easy_wrf-hydro_build/blob/main/docs/index.md"

[project.optional-dependencies]
parameters = ["numpy>=1.24", "netCDF4>=1.6", "matplotlib>=3.7"]
forcing = ["numpy>=1.24", "netCDF4>=1.6", "xarray>=2024.3"]
aorc = ["zarr>=2.18,<3", "fsspec>=2024.3", "aiohttp>=3.9", "dask[array]>=2024.3"]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.0",
    "markdown-it-py>=3.0",
]

[project.scripts]
ewhb = "easy_wrf_hydro_build.cli:main"
easy-wrf-hydro-build = "easy_wrf_hydro_build.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["easy_wrf_hydro_build*"]

[tool.setuptools.package-data]
easy_wrf_hydro_build = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.ruff]
line-length = 100
